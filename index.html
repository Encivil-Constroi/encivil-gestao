<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- SEO -->
    <title>ENCIVIL Gestão</title>
    <meta name="description" content="Sistema interno de gestão da ENCIVIL — armazém, obras, ferramentas e mais" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Anti-FOUC: aplica .dark/.light no <html> antes da primeira renderização.
         Sem isto o browser mostra um flash do tema claro antes do React hidratação. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('encivil-theme')
          if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches))
            document.documentElement.classList.add('dark')
          else if (t === 'light')
            document.documentElement.classList.add('light')
        } catch (e) {}
      })()
    </script>

    <!-- Tema -->
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="msapplication-TileColor" content="#1e3a8a" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Ícones -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/pwa-64x64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- iOS / Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ENCIVIL Gestão" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <style>
      html, body { height: 100%; margin: 0; }
      #root { height: 100%; }
      /* Safe area para iPhone com notch/Dynamic Island */
      body { padding-top: env(safe-area-inset-top); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

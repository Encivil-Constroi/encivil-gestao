version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Lisbon }
    open-pull-requests-limit: 5
    groups:
      radix: { patterns: ["@radix-ui/*"] }
      dev: { dependency-type: development }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Lisbon }
